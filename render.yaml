services:
  - type: worker
    name: sweezy-news-bot
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      - key: CHANNEL_ID
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: POST_CRON
        value: 0 9,15 * * *
      - key: TIMEZONE
        value: Europe/Zurich
      - key: SQLITE_PATH
        value: /data/sweezy.db
    disk:
      name: sweezy-data
      mountPath: /data
      sizeGB: 1
